<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Industrial Fluid Analyzer</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; background: #f4f4f9; color: #333; margin: 0; }
    .card { background: white; padding: 18px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); margin-bottom: 15px; }
    label { font-weight: bold; font-size: 0.9em; display: block; margin-top: 10px; }
    input, select, button { width: 100%; padding: 12px; margin: 6px 0 12px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 1em; }
    button { background: #0056b3; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 6px; }
    button:active { background: #003d80; }
    .secondary-btn { background: #6c757d; margin-top: 2px; }
    .camera-container { position: relative; width: 100%; background: #000; border-radius: 8px; overflow: hidden; margin: 10px 0; min-height: 200px; display: flex; align-items: center; justify-content: center; }
    video { width: 100%; max-height: 350px; object-fit: cover; display: none; }
    img#preview { width: 100%; max-height: 350px; object-fit: contain; display: none; }
    .placeholder-text { color: #aaa; font-size: 0.9em; text-align: center; padding: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; border-radius: 8px; overflow: hidden; }
    th, td { border: 1px solid #e0e0e0; padding: 10px; text-align: left; font-size: 0.85em; }
    th { background: #0056b3; color: white; }
    .abnormal { background-color: #ffdddd; color: #b30000; font-weight: bold; }
    .normal { background-color: #e6ffe6; color: #008000; }
    #loading { text-align: center; font-weight: bold; color: #0056b3; margin: 15px 0; }
    .key-toggle { font-size: 0.8em; color: #666; cursor: pointer; text-decoration: underline; margin-top: 5px; display: inline-block; }
    footer { text-align: center; font-size: 0.8em; color: #666; padding: 15px 0 5px 0; margin-top: 20px; border-top: 1px solid #e0e0e0; }
    .rule-input-group { display: flex; gap: 8px; margin-bottom: 8px; }
    .rule-input-group input { margin: 0; }
    .rule-input-group button { margin: 0; width: auto; padding: 0 16px; white-space: nowrap; }
  </style>
</head>
<body>

  <h2>Industrial Fluid Analyzer</h2>

  <div class="card">
    <div id="keySection" style="display: none;">
      <label for="apiKey">Gemini API Key (Custom Override):</label>
      <input type="password" id="apiKey" placeholder="Leave blank to use system key">
    </div>

    <span class="key-toggle" onclick="toggleKeyField()">Change / View API Key</span>

    <label for="fluidType">Fluid Type:</label>
    <input type="text" id="fluidType" placeholder="e.g. #2 Diesel, Chevron GST 46, Engine Oil">

    <label for="machineType">Machine / Application:</label>
    <select id="machineType">
      <option value="Engine Assy">Engine Assy</option>
      <option value="HYDRAULIC">Hydraulic</option>
      <option value="FINAL DRIVE">Final Drive (Gearbox)</option>
      <option value="SWING MACHINERY">Swing Machinery (Gearbox)</option>
      <option value="Other">Other / General Equipment</option>
    </select>

    <!-- Custom Rule Management Section -->
    <div style="background: #f8f9fa; border: 1px dashed #0056b3; padding: 12px; border-radius: 8px; margin: 10px 0;">
      <label style="cursor: pointer; color: #0056b3; margin-top: 0;" onclick="toggleRulePanel()">
        ⚙️ Edit Custom Equipment Threshold Rules
      </label>
      
      <div id="rulePanel" style="display: none; margin-top: 10px;">
        <p style="font-size: 0.8em; color: #666; margin: 0 0 8px 0;">Add custom parameter limits to flag as ABNORMAL when met or exceeded.</p>
        
        <div class="rule-input-group">
          <input type="text" id="customParamName" placeholder="Parameter (e.g. Iron, Viscosity)">
          <input type="number" id="customParamLimit" placeholder="Limit (e.g. 50)">
          <button type="button" onclick="addCustomRule()" style="background: #28a745;">Add</button>
        </div>

        <ul id="ruleList" style="font-size: 0.85em; padding-left: 20px; margin: 8px 0 0 0;"></ul>
      </div>
    </div>

    <label>Lab Report Image Capture:</label>
    <div class="camera-container">
      <div id="placeholder" class="placeholder-text">Camera offline. Tap "Start Camera" or select a file.</div>
      <video id="video" autoplay playsinline></video>
      <img id="preview" alt="Captured preview">
    </div>

    <button type="button" id="startCamBtn" onclick="startCamera()">Start Camera</button>
    <button type="button" id="captureBtn" onclick="capturePhoto()" style="display:none; background:#28a745;">Snap Photo</button>
    <button type="button" id="switchCamBtn" class="secondary-btn" onclick="switchCamera()" style="display:none;">Switch Camera</button>
    
    <label for="fileInput" style="margin-top:15px;">Or Upload File from Gallery:</label>
    <input type="file" id="fileInput" accept="image/*" onchange="handleFileUpload(event)">

    <button type="button" onclick="analyzeReport()" style="margin-top:15px; background:#0056b3;">Analyze Lab Report</button>
  </div>

  <div id="loading" style="display:none;">Analyzing report image...</div>
  <div id="results"></div>

  <footer>
    &copy; 2026 Troy Michael Goldman. All Rights Reserved.
  </footer>

  <script>
    const EMBEDDED_KEY_OBFUSCATED = "YOUR_SCRAMBLED_BASE64_STRING_HERE";

    let currentStream = null;
    let facingMode = "environment";
    let capturedImageBase64 = null;
    let customRules = JSON.parse(localStorage.getItem('user_fluid_rules') || '[]');

    function getActiveApiKey() {
      const customKey = document.getElementById('apiKey').value.trim();
      if (customKey) return customKey;
      
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) return savedKey;

      if (EMBEDDED_KEY_OBFUSCATED && EMBEDDED_KEY_OBFUSCATED !== "YOUR_SCRAMBLED_BASE64_STRING_HERE") {
        try {
          return atob(EMBEDDED_KEY_OBFUSCATED);
        } catch (e) {
          console.error("Failed to decode system API key.");
        }
      }
      return "";
    }

    function toggleKeyField() {
      const keySection = document.getElementById('keySection');
      keySection.style.display = (keySection.style.display === 'none') ? 'block' : 'none';
    }

    function toggleRulePanel() {
      const panel = document.getElementById('rulePanel');
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
      renderRuleList();
    }

    function addCustomRule() {
      const param = document.getElementById('customParamName').value.trim();
      const limit = document.getElementById('customParamLimit').value.trim();

      if (!param || !limit) {
        alert("Please enter both a parameter name and numerical threshold limit.");
        return;
      }

      customRules.push({ param, limit });
      localStorage.setItem('user_fluid_rules', JSON.stringify(customRules));
      
      document.getElementById('customParamName').value = '';
      document.getElementById('customParamLimit').value = '';
      renderRuleList();
    }

    function deleteCustomRule(index) {
      customRules.splice(index, 1);
      localStorage.setItem('user_fluid_rules', JSON.stringify(customRules));
      renderRuleList();
    }

    function renderRuleList() {
      const list = document.getElementById('ruleList');
      list.innerHTML = '';
      if (customRules.length === 0) {
        list.innerHTML = '<li style="color:#888;">No custom rules added.</li>';
        return;
      }
      customRules.forEach((rule, idx) => {
        list.innerHTML += `<li><b>${rule.param}</b>: ABNORMAL if >= ${rule.limit} 
          <a href="#" onclick="deleteCustomRule(${idx}); return false;" style="color:red; margin-left:10px;">[Delete]</a></li>`;
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) {
        document.getElementById('apiKey').value = savedKey;
      }
      renderRuleList();
    });

    document.getElementById('apiKey').addEventListener('input', (e) => {
      const val = e.target.value.trim();
      if (val) {
        localStorage.setItem('gemini_api_key', val);
      } else {
        localStorage.removeItem('gemini_api_key');
      }
    });

    async function startCamera() {
      stopCamera();
      const video = document.getElementById('video');
      const preview = document.getElementById('preview');
      const placeholder = document.getElementById('placeholder');

      preview.style.display = 'none';
      placeholder.style.display = 'none';

      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: facingMode } }
        });
      } catch (err) {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingMode }
        });
      }

      video.srcObject = currentStream;
      video.style.display = 'block';
      document.getElementById('startCamBtn').style.display = 'none';
      document.getElementById('captureBtn').style.display = 'block';
      document.getElementById('switchCamBtn').style.display = 'block';
    }

    function stopCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
        currentStream = null;
      }
    }

    function switchCamera() {
      facingMode = (facingMode === "environment") ? "user" : "environment";
      startCamera();
    }

    function capturePhoto() {
      const video = document.getElementById('video');
      const preview = document.getElementById('preview');
      const canvas = document.createElement('canvas');

      const maxDim = 1280;
      let width = video.videoWidth;
      let height = video.videoHeight;

      if (width > maxDim || height > maxDim) {
        if (width > height) {
          height = Math.round((height * maxDim) / width);
          width = maxDim;
        } else {
          width = Math.round((width * maxDim) / height);
          height = maxDim;
        }
      }

      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, width, height);

      capturedImageBase64 = canvas.toDataURL('image/jpeg', 0.85);

      preview.src = capturedImageBase64;
      preview.style.display = 'block';
      video.style.display = 'none';

      stopCamera();

      document.getElementById('captureBtn').style.display = 'none';
      document.getElementById('switchCamBtn').style.display = 'none';
      document.getElementById('startCamBtn').style.display = 'block';
      document.getElementById('startCamBtn').innerText = 'Retake Photo';
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      stopCamera();
      document.getElementById('video').style.display = 'none';
      document.getElementById('placeholder').style.display = 'none';
      document.getElementById('captureBtn').style.display = 'none';
      document.getElementById('switchCamBtn').style.display = 'none';

      const reader = new FileReader();
      reader.onload = (e) => {
        capturedImageBase64 = e.target.result;
        const preview = document.getElementById('preview');
        preview.src = capturedImageBase64;
        preview.style.display = 'block';
      };
      reader.readAsDataURL(file);
    }

    async function analyzeReport() {
      const apiKey = getActiveApiKey();
      const fluidType = document.getElementById('fluidType').value.trim();
      const machineType = document.getElementById('machineType').value;

      if (!apiKey) {
        alert("No API key detected. Please tap 'Change / View API Key' to set one.");
        return;
      }

      if (!capturedImageBase64) {
        alert("Please capture or select a lab report image first.");
        return;
      }

      document.getElementById('loading').style.display = 'block';
      document.getElementById('results').innerHTML = '';

      try {
        const imageRaw = capturedImageBase64.split(',')[1];
        const mimeType = capturedImageBase64.substring(
          capturedImageBase64.indexOf(":") + 1,
          capturedImageBase64.indexOf(";")
        ) || "image/jpeg";

        let userRulePrompt = "";
        if (customRules.length > 0) {
          userRulePrompt = "\nUSER-DEFINED CUSTOM OVERRIDE RULES:\n" + 
            customRules.map(r => `• ${r.param}: ABNORMAL if >= ${r.limit}`).join('\n');
        }

        const systemPrompt = `You are an expert industrial fluid analysis evaluator.
Analyze the provided lab report image based on the specified fluid type and machine application.

GLOBAL RULE:
1. Assign flags strictly as "NORMAL" or "ABNORMAL". Do NOT use "MONITOR" or "CRITICAL". Any value meeting or exceeding a "Monitor" or "Abnormal" threshold listed below MUST be flagged as "ABNORMAL".
2. HARD RULE FOR DIESEL FUEL: Any ISO Cleanliness Code exceeding 18/16/13 (such as 19/19/17, 18/17/14, 18/17/13) MUST be flagged as "ABNORMAL".

ISO 4406 CLEANLINESS HARD LIMITS BY APPLICATION:
- HYDRAULICS:
  • Normal up to xx/18/15.
  • ABNORMAL if the second digit (6µm micron scale) is 19 or higher (e.g. xx/19/xx, 20/19/16).
- GEARBOXES (Final Drive, Swing Machinery, Industrial Gearboxes):
  • Highest acceptable normal level is xx/19/16.
  • ABNORMAL if the second digit (6µm micron scale) is 20 or higher (e.g. xx/20/xx, 22/20/17).

EQUIPMENT WEAR & CONTAMINANT HARD LIMITS (PPM / Index):
Evaluate elements against the specific equipment type rules below. Flag as "ABNORMAL" if the detected result reaches or exceeds the lower limit listed:

- Engine Assy:
  • Iron (Fe): ABNORMAL if >= 100
  • Copper (Cu): ABNORMAL if >= 25
  • Chromium (Cr): ABNORMAL if >= 10
  • Aluminum (Al): ABNORMAL if >= 8
  • Silicon (Si): ABNORMAL if >= 20
  • Lead (Pb): ABNORMAL if >= 40
  • Sodium (Na): ABNORMAL if >= 50
  • PQ Index: ABNORMAL if >= 24

- HYDRAULIC:
  • Iron (Fe): ABNORMAL if >= 40
  • Copper (Cu): ABNORMAL if >= 200
  • Silicon (Si): ABNORMAL if >= 10
  • Lead (Pb): ABNORMAL if >= 30
  • PQ Index: ABNORMAL if >= 16

- FINAL DRIVE (Gearbox):
  • Iron (Fe): ABNORMAL if >= 500
  • Copper (Cu): ABNORMAL if >= 100
  • Silicon (Si): ABNORMAL if >= 30
  • Lead (Pb): ABNORMAL if >= 100
  • PQ Index: ABNORMAL if >= 166

- SWING MACHINERY (Gearbox):
  • Iron (Fe): ABNORMAL if >= 400
  • Copper (Cu): ABNORMAL if >= 100
  • Silicon (Si): ABNORMAL if >= 40
  • Lead (Pb): ABNORMAL if >= 40
  • PQ Index: ABNORMAL if >= 51
${userRulePrompt}

JSON SCHEMA:
Return output strictly as valid JSON matching this schema:
{
  "evaluations": [
    {
      "lineNumber": "string",
      "testName": "string",
      "parameterName": "string",
      "result": "string",
      "flag": "NORMAL or ABNORMAL",
      "reason": "string"
    }
  ]
}`;

        const payload = {
          system_instruction: { parts: [{ text: systemPrompt }] },
          contents: [{
            parts: [
              { inline_data: { mime_type: mimeType, data: imageRaw } },
              { text: `Fluid Type: ${fluidType}\nMachine Application: ${machineType}\nAnalyze line-by-line using the matching equipment rules.` }
            ]
          }],
          generationConfig: { responseMimeType: "application/json" }
        };

        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${encodeURIComponent(apiKey)}`;

        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (data.error) {
          throw new Error(data.error.message || "API Error");
        }

        const jsonText = data.candidates[0].content.parts[0].text;
        const parsed = JSON.parse(jsonText);

        renderResults(parsed.evaluations);
      } catch (err) {
        alert("Analysis failed: " + err.message);
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }

    function renderResults(evaluations) {
      if (!evaluations || evaluations.length === 0) {
        document.getElementById('results').innerHTML = "<p>No parameters detected.</p>";
        return;
      }

      const flaggedEvaluations = evaluations.filter(e => e.flag === 'ABNORMAL');

      if (flaggedEvaluations.length === 0) {
        document.getElementById('results').innerHTML = `
          <div style="background-color: #e6ffe6; color: #008000; padding: 15px; border-radius: 8px; border: 1px solid #b2e6b2; text-align: center; font-weight: bold; margin-top: 15px;">
            All parameters are within normal operating limits. No abnormal issues detected.
          </div>`;
        return;
      }

      let html = `<table>
        <thead>
          <tr>
            <th>Line</th>
            <th>Test</th>
            <th>Parameter</th>
            <th>Result</th>
            <th>Flag</th>
            <th>Reason</th>
          </tr>
        </thead>
        <tbody>`;

      flaggedEvaluations.forEach(e => {
        html += `<tr>
          <td>${e.lineNumber || ''}</td>
          <td>${e.testName || ''}</td>
          <td>${e.parameterName || ''}</td>
          <td>${e.result || ''}</td>
          <td class="abnormal">${e.flag}</td>
          <td>${e.reason || ''}</td>
        </tr>`;
      });

      html += `</tbody></table>`;
      document.getElementById('results').innerHTML = html;
    }
  </script>
</body>
</html>
