<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Industrial Fluid Analyzer v1.1.5</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; background: #f4f4f9; color: #333; margin: 0; }
    .card { background: white; padding: 18px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); margin-bottom: 15px; }
    label { font-weight: bold; font-size: 0.9em; display: block; margin-top: 10px; }
    input, select, button { width: 100%; padding: 12px; margin: 6px 0 12px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 1em; }
    button { background: #0056b3; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 6px; }
    button:active { background: #003d80; }
    .secondary-btn { background: #6c757d; margin-top: 2px; }
    .camera-container { position: relative; width: 100%; background: #000; border-radius: 8px; overflow: hidden; margin: 10px 0; min-height: 200px; display: flex; align-items: center; justify-content: center; }
    video { width: 100%; max-height: 350px; object-fit: cover; display: none; }
    img#preview { width: 100%; max-height: 350px; object-fit: contain; display: none; }
    .placeholder-text { color: #aaa; font-size: 0.9em; text-align: center; padding: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; border-radius: 8px; overflow: hidden; }
    th, td { border: 1px solid #e0e0e0; padding: 10px; text-align: left; font-size: 0.85em; }
    th { background: #0056b3; color: white; }
    .flag-select { padding: 6px 8px; font-weight: bold; border-radius: 4px; border: 1px solid #ccc; width: 100%; margin: 0; font-size: 0.85em; }
    .flag-normal { background-color: #e6ffe6; color: #008000; border-color: #b2e6b2; }
    .flag-monitor { background-color: #fff3cd; color: #856404; border-color: #ffeeba; }
    .flag-abnormal { background-color: #ffe5d0; color: #d9534f; border-color: #f5c6cb; }
    .flag-critical { background-color: #ffdddd; color: #b30000; border-color: #ffaaaa; font-weight: 900; }
    #loading { text-align: center; font-weight: bold; color: #0056b3; margin: 15px 0; }
    footer { text-align: center; font-size: 0.8em; color: #666; padding: 15px 0 5px 0; margin-top: 20px; border-top: 1px solid #e0e0e0; }
    .memory-badge { font-size: 0.7em; background: #0056b3; color: #ffffff; padding: 2px 6px; border-radius: 4px; margin-top: 4px; display: inline-block; }
    .version-tag { font-size: 0.45em; background: #28a745; color: #ffffff; padding: 3px 8px; border-radius: 12px; vertical-align: middle; margin-left: 8px; font-weight: normal; }
  </style>
</head>
<body>

  <h2 style="display: flex; align-items: center; justify-content: space-between;">
    <span>Industrial Fluid Analyzer <span class="version-tag">v1.1.5</span></span>
  </h2>

  <div class="card">
    <label for="fluidType">Fluid Type:</label>
    <input type="text" id="fluidType" placeholder="e.g. #2 Diesel, Chevron GST 46, Engine Oil">

    <label for="machineType">Machine / Application:</label>
    <select id="machineType">
      <option value="Engine Assy">Engine Assy</option>
      <option value="HYDRAULIC">Hydraulic</option>
      <option value="FINAL DRIVE">Final Drive (Gearbox)</option>
      <option value="SWING MACHINERY">Swing Machinery (Gearbox)</option>
      <option value="Other">Other / General Equipment</option>
    </select>

    <label>Lab Report Image Capture:</label>
    <div class="camera-container">
      <div id="placeholder" class="placeholder-text">Camera offline. Tap "Start Camera" or select a file.</div>
      <video id="video" autoplay playsinline></video>
      <img id="preview" alt="Captured preview">
    </div>

    <button type="button" id="startCamBtn" onclick="startCamera()">Start Camera</button>
    <button type="button" id="captureBtn" onclick="capturePhoto()" style="display:none; background:#28a745;">Snap Photo</button>
    <button type="button" id="switchCamBtn" class="secondary-btn" onclick="switchCamera()" style="display:none;">Switch Camera</button>
    
    <label for="fileInput" style="margin-top:15px;">Or Upload File from Gallery:</label>
    <input type="file" id="fileInput" accept="image/*" onchange="handleFileUpload(event)">

    <button type="button" onclick="analyzeReport()" style="margin-top:15px; background:#0056b3;">Analyze Lab Report</button>
  </div>

  <div id="loading" style="display:none;">Analyzing report image...</div>
  
  <div id="resultsCard" class="card" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <h3 style="margin:0;">Analysis Results</h3>
      <button type="button" onclick="clearSavedOverrides()" style="width:auto; padding:6px 12px; font-size:0.75em; background:#dc3545;">Reset Learned Rules</button>
    </div>
    <div id="results"></div>
  </div>

  <footer>
    &copy; 2026 Troy Michael Goldman. All Rights Reserved. &bull; Build v1.1.5
  </footer>

  <script>
    // PASTE YOUR AIzaSy... API KEY INSIDE THE QUOTES BELOW
    const GEMINI_API_KEY = "AIzaSy_YOUR_UNBILLED_PROJECT_KEY_HERE";

    let currentStream = null;
    let facingMode = "environment";
    let capturedImageBase64 = null;
    let currentEvaluations = [];

    let ruleMemory = JSON.parse(localStorage.getItem('fluid_analyzer_rule_memory') || '{}');

    async function startCamera() {
      stopCamera();
      const video = document.getElementById('video');
      const preview = document.getElementById('preview');
      const placeholder = document.getElementById('placeholder');

      preview.style.display = 'none';
      placeholder.style.display = 'none';

      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: facingMode } }
        });
      } catch (err) {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingMode }
        });
      }

      video.srcObject = currentStream;
      video.style.display = 'block';
      document.getElementById('startCamBtn').style.display = 'none';
      document.getElementById('captureBtn').style.display = 'block';
      document.getElementById('switchCamBtn').style.display = 'block';
    }

    function stopCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
        currentStream = null;
      }
    }

    function switchCamera() {
      facingMode = (facingMode === "environment") ? "user" : "environment";
      startCamera();
    }

    function capturePhoto() {
      const video = document.getElementById('video');
      const preview = document.getElementById('preview');
      const canvas = document.createElement('canvas');

      const maxDim = 1280;
      let width = video.videoWidth;
      let height = video.videoHeight;

      if (width > maxDim || height > maxDim) {
        if (width > height) {
          height = Math.round((height * maxDim) / width);
          width = maxDim;
        } else {
          width = Math.round((width * maxDim) / height);
          height = maxDim;
        }
      }

      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, width, height);

      capturedImageBase64 = canvas.toDataURL('image/jpeg', 0.85);

      preview.src = capturedImageBase64;
      preview.style.display = 'block';
      video.style.display = 'none';

      stopCamera();

      document.getElementById('captureBtn').style.display = 'none';
      document.getElementById('switchCamBtn').style.display = 'none';
      document.getElementById('startCamBtn').style.display = 'block';
      document.getElementById('startCamBtn').innerText = 'Retake Photo';
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      stopCamera();
      document.getElementById('video').style.display = 'none';
      document.getElementById('placeholder').style.display = 'none';
      document.getElementById('captureBtn').style.display = 'none';
      document.getElementById('switchCamBtn').style.display = 'none';

      const reader = new FileReader();
      reader.onload = (e) => {
        capturedImageBase64 = e.target.result;
        const preview = document.getElementById('preview');
        preview.src = capturedImageBase64;
        preview.style.display = 'block';
      };
      reader.readAsDataURL(file);
    }

    async function analyzeReport() {
      const fluidType = document.getElementById('fluidType').value.trim();
      const machineType = document.getElementById('machineType').value;

      if (!capturedImageBase64) {
        alert("Please capture or select a lab report image first.");
        return;
      }

      if (!GEMINI_API_KEY || GEMINI_API_KEY.includes("YOUR_UNBILLED")) {
        alert("Please paste your AIzaSy API key on line 122 of index.html.");
        return;
      }

      document.getElementById('loading').style.display = 'block';
      document.getElementById('resultsCard').style.display = 'none';
      document.getElementById('results').innerHTML = '';

      try {
        const imageRaw = capturedImageBase64.split(',')[1];
        const mimeType = capturedImageBase64.substring(
          capturedImageBase64.indexOf(":") + 1,
          capturedImageBase64.indexOf(";")
        ) || "image/jpeg";

        const systemPrompt = `You are an expert industrial fluid analysis evaluator.
Analyze the provided lab report image completely and extract ALL line items and parameters.

RULES:
1. Extract and evaluate ALL tested parameters (viscosity, wear metals, ISO cleanliness codes, additive levels, water content, contaminants, etc.).
2. Assign flags strictly as one of: "NORMAL", "MONITOR", "ABNORMAL", or "CRITICAL".
3. Return output strictly as valid JSON matching this schema:
{
  "evaluations": [
    {
      "lineNumber": "string",
      "testName": "string",
      "parameterName": "string",
      "result": "string",
      "flag": "NORMAL, MONITOR, ABNORMAL, or CRITICAL",
      "reason": "string"
    }
  ]
}`;

        const payload = {
          system_instruction: { parts: [{ text: systemPrompt }] },
          contents: [{
            parts: [
              { inline_data: { mime_type: mimeType, data: imageRaw } },
              { text: `Fluid Type: ${fluidType}\nMachine Application: ${machineType}\nExtract and evaluate all parameters line-by-line using four flag categories: NORMAL, MONITOR, ABNORMAL, CRITICAL.` }
            ]
          }],
          generationConfig: { responseMimeType: "application/json" }
        };

        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(GEMINI_API_KEY)}`;

        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (data.error) {
          throw new Error(data.error.message || "API Error");
        }

        const jsonText = data.candidates[0].content.parts[0].text;
        const parsed = JSON.parse(jsonText);

        currentEvaluations = parsed.evaluations || [];
        applyStoredRulesAndRender(machineType);
      } catch (err) {
        alert("Analysis failed: " + err.message);
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }

    function applyStoredRulesAndRender(machineType) {
      currentEvaluations.forEach(item => {
        const ruleKey = `${machineType}::${(item.parameterName || '').trim().toUpperCase()}`;
        if (ruleMemory[ruleKey]) {
          item.flag = ruleMemory[ruleKey];
          item.isOverridden = true;
        } else {
          item.isOverridden = false;
        }
      });

      renderResultsTable(machineType);
    }

    function getFlagStyleClass(flag) {
      switch ((flag || '').toUpperCase()) {
        case 'MONITOR': return 'flag-monitor';
        case 'ABNORMAL': return 'flag-abnormal';
        case 'CRITICAL': return 'flag-critical';
        default: return 'flag-normal';
      }
    }

    function handleFlagChange(index, machineType, selectElement) {
      const newFlag = selectElement.value;
      const item = currentEvaluations[index];
      item.flag = newFlag;
      item.isOverridden = true;

      const ruleKey = `${machineType}::${(item.parameterName || '').trim().toUpperCase()}`;
      ruleMemory[ruleKey] = newFlag;
      localStorage.setItem('fluid_analyzer_rule_memory', JSON.stringify(ruleMemory));

      selectElement.className = `flag-select ${getFlagStyleClass(newFlag)}`;
      
      const parentTd = selectElement.parentElement;
      if (!parentTd.querySelector('.memory-badge')) {
        const badge = document.createElement('span');
        badge.className = 'memory-badge';
        badge.innerText = 'Learned';
        parentTd.appendChild(badge);
      }

      renderResultsTable(machineType);
    }

    function clearSavedOverrides() {
      if (confirm("Reset all learned flag rules for this device?")) {
        localStorage.removeItem('fluid_analyzer_rule_memory');
        ruleMemory = {};
        const machineType = document.getElementById('machineType').value;
        currentEvaluations.forEach(i => i.isOverridden = false);
        renderResultsTable(machineType);
      }
    }

    function renderResultsTable(machineType) {
      document.getElementById('resultsCard').style.display = 'block';

      if (!currentEvaluations || currentEvaluations.length === 0) {
        document.getElementById('results').innerHTML = "<p>No parameters detected.</p>";
        return;
      }

      const displayEvaluations = currentEvaluations.filter(e => {
        const flag = (e.flag || 'NORMAL').toUpperCase();
        return flag === 'MONITOR' || flag === 'ABNORMAL' || flag === 'CRITICAL';
      });

      if (displayEvaluations.length === 0) {
        document.getElementById('results').innerHTML = `
          <div style="background-color: #e6ffe6; color: #008000; padding: 15px; border-radius: 8px; border: 1px solid #b2e6b2; text-align: center; font-weight: bold;">
            All parameters are within normal operating limits. No monitor or abnormal issues detected.
          </div>`;
        return;
      }

      let html = `<table>
        <thead>
          <tr>
            <th>Line</th>
            <th>Test / Parameter</th>
            <th>Result</th>
            <th>Flag Status</th>
            <th>Reason</th>
          </tr>
        </thead>
        <tbody>`;

      displayEvaluations.forEach((e) => {
        const realIdx = currentEvaluations.indexOf(e);
        const currentFlag = (e.flag || 'NORMAL').toUpperCase();
        const selectClass = getFlagStyleClass(currentFlag);
        const memoryBadge = e.isOverridden ? `<br><span class="memory-badge">Learned</span>` : '';

        html += `<tr>
          <td>${e.lineNumber || ''}</td>
          <td><b>${e.parameterName || ''}</b><br><small style="color:#666;">${e.testName || ''}</small></td>
          <td>${e.result || ''}</td>
          <td>
            <select class="flag-select ${selectClass}" onchange="handleFlagChange(${realIdx}, '${machineType}', this)">
              <option value="NORMAL">NORMAL</option>
              <option value="MONITOR" ${currentFlag === 'MONITOR' ? 'selected' : ''}>MONITOR</option>
              <option value="ABNORMAL" ${currentFlag === 'ABNORMAL' ? 'selected' : ''}>ABNORMAL</option>
              <option value="CRITICAL" ${currentFlag === 'CRITICAL' ? 'selected' : ''}>CRITICAL</option>
            </select>
            ${memoryBadge}
          </td>
          <td>${e.reason || ''}</td>
        </tr>`;
      });

      html += `</tbody></table>`;
      document.getElementById('results').innerHTML = html;
    }
  </script>
</body>
</html>
